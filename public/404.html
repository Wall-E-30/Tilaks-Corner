<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>The Mindverse — Restoring Cosmic Coordinates</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script: encodes deep path and redirects to index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var targetPath = '/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(targetPath) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#05060F;color:#FFC857;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;">
    <div>
      <p style="font-size:1.2rem;letter-spacing:0.1em;">✦ THE MINDVERSE ✦</p>
      <p style="color:#EDEBFA;opacity:0.8;">Restoring celestial coordinates...</p>
    </div>
  </body>
</html>
